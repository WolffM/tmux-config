# --- base UX ---
# prefix: Ctrl-Space (comfy, ~zero conflict). Ctrl-b still works as a backup.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g default-terminal "tmux-256color"

# feed the terminal (Konsole) a useful title = active window index + name,
# e.g. "4: hadoku_site". Konsole shows it via the %w tab-title format.
set -g set-titles on
set -g set-titles-string "#I: #W"
set -g status-position top   # window-list bar at the TOP

# --- tab names track the DIRECTORY, not the running command ---
# tmux's default automatic-rename-format is #{pane_current_command}, which made
# every tab read "claude" (or "bash"). Use the basename of the pane's cwd
# instead, minus a leading hadoku-/hadoku_ so ~/repos/hadoku-trader reads as
# "trader". Renaming a window by hand (prefix + R) turns auto-rename off for
# that window only, so a manual name sticks.
setw -g automatic-rename on
setw -g automatic-rename-format '#{s/^hadoku[-_]//:#{b:pane_current_path}}'

# --- dark status bar (replaces the default green) ---
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g window-status-current-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g window-status-style "fg=#c0caf5"
set -g window-status-activity-style "fg=#e0af68,none"
set -g window-status-separator "  "
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-style "fg=#3b4261"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"

# new windows / splits open in the CURRENT directory (default is the session's
# start dir). So Ctrl-b c lands you in the same repo, ready for `cr` / claude.
# --- tab + split keys (all pressed AFTER the Ctrl-Space prefix) ---
bind t     new-window -c "#{pane_current_path}"       # new tab
bind -r Tab  next-window                              # next tab
bind -r BTab previous-window                          # prev tab (Shift+Tab)
bind R     command-prompt -I "#W" "rename-window '%%'" # rename tab (pins the name)
bind C-w   kill-pane                                  # close focused pane; last pane closes the tab

# --- sessions (one per kind of work, e.g. platform / creative) ---
# prefix + s  pick a session/tab from a tree (tmux default)
# prefix + (  /  )  previous / next session (tmux default)
# prefix + $  rename session (tmux default)
bind N command-prompt -p "new session:" "new-session -s '%%' -c '#{pane_current_path}'"  # new session, switch to it
bind M command-prompt -p "move tab to session:" "move-window -t '=%%:'"                 # move this tab to another session
set -g status-left-length 20
set -g status-left "#[bold] #S #[default] "  # current session name, left of the tabs
bind ]     split-window -h -c "#{pane_current_path}"  # split right
bind [     split-window -v -c "#{pane_current_path}"  # split down
# (old awkward split keys removed; %/" defaults left alone as harmless fallback)

# --- kill-window is unreachable; kill-pane is the only way to close anything ---
# Ctrl-w takes one pane at a time, and closes the tab only when it takes the
# last one. Every shortcut that nukes a whole tab full of splits in a single
# keystroke is gone: X, the & confirm-kill default, and the Kill/Respawn
# entries in the window menu. Respawn goes too -- respawn-window -k kills every
# pane in the window just like kill-window does.
unbind X
unbind &
# The window menu (prefix + < , and right-click a tab in the status bar) is
# tmux's default minus Kill and Respawn. Right-click is one slip away from
# Kill in a mouse-first setup, which is exactly the accident worth removing.
bind      < display-menu -T "#[align=centre]#{window_index}:#{window_name}" -x W -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left"  l { swap-window -t :-1 } \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
  "#{?pane_marked_set,,-}Swap Marked"          s { swap-window } \
  '' \
  "#{?pane_marked,Unmark,Mark}"                m { select-pane -m } \
  Rename                                       n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  '' \
  "New After"                                  w { new-window -a } \
  "New At End"                                 W { new-window }
bind -T root MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left"  l { swap-window -t :-1 } \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
  "#{?pane_marked_set,,-}Swap Marked"          s { swap-window } \
  '' \
  "#{?pane_marked,Unmark,Mark}"                m { select-pane -m } \
  Rename                                       n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
  '' \
  "New After"                                  w { new-window -a } \
  "New At End"                                 W { new-window }
# Alt+right-click on the status bar is a duplicate of the same default menu.
unbind -T root M-MouseDown3Status

# --- copy to the Wayland system clipboard ---
set -g set-clipboard on
# mouse-drag release -> copy selection to the system clipboard (and exit copy-mode)
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
# keyboard copy-mode: y or Enter also copy to the clipboard
bind -T copy-mode    y     send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: restore claude with its full command line + pane contents
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude"'

# continuum: auto-SAVE layout every 5 min. Auto-restore is deliberately OFF —
# the restore-on-session-created hook races/clobbers any session you build and
# once restored a bad layout it kept re-restoring it. Restore is on-demand
# instead: `claude-session` (attach or create+restore) or prefix + Ctrl-r.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# resurrect: rewrite each claude pane's restore command to `claude --resume
# <sessionId>` so restored panes reattach to their EXACT session (handles
# multiple sessions in one repo) instead of dropping to the picker. Runs
# pre-dedup, so a stable layout still collapses to one state file.
set -g @resurrect-hook-post-save-layout 'bash ~/.local/bin/claude-tmux-session-hook'

run '~/.tmux/plugins/tpm/tpm'
